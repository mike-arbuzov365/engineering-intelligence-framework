name: ci

# Job display names say "(required by policy)", not "(blocking)" - these
# checks run and report pass/fail, but nothing at the GitHub repository-
# settings level currently prevents merging past a failure (required
# status checks / branch protection are not configured). See
# core/policies/decisions.md and docs/architecture/HOW-EIF-WORKS.md#quality
# for why that distinction is stated explicitly rather than implied.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default: none of these jobs push, comment, or otherwise
# write back to the repository - they only read the checkout and report
# pass/fail. Override per-job if a future job genuinely needs more.
permissions:
  contents: read

jobs:
  privacy-scan:
    name: Privacy scan (required by policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        # Newly required by this job: eif_privacy_scan.py now imports
        # PyYAML (privacy.suppressions support) - caught live by this same
        # PR's own CI run, not by local testing, since the local machine
        # already had PyYAML installed for other scripts. Without this
        # step, the import fails, suppressions silently load as [], and
        # every suppression-mechanism test fails on a clean runner.
        run: pip install -r scripts/requirements.txt
      - name: Run privacy scan unit tests
        # Adoption-hardening correction: this suite (detection, redaction,
        # fail-closed, and the suppression/baseline mechanism) previously
        # ran nowhere in CI despite claims-evidence.md counting it among
        # the tested suites - a real doc-vs-CI gap, fixed here rather than
        # just corrected in the doc.
        run: python scripts/tests/test_privacy_scan.py
      - name: Run privacy scan
        run: python scripts/eif_privacy_scan.py --repo .

  frontmatter-and-config-validation:
    name: Frontmatter and config schema validation (required by policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        # scripts/requirements.txt pins exact versions (==), which is what
        # keeps this from floating on latest - hash-pinning
        # (--require-hashes) is a possible future hardening step, not
        # implemented yet, see scripts/README.md#dependency-update-ownership.
        run: pip install -r scripts/requirements.txt
      - name: Validate ontology, policy, guide, and product-claims frontmatter
        run: python scripts/eif_validate_frontmatter.py --framework-root . --instance-root . "core/ontology/*.md" "core/policies/*.md" "docs/guides/*.md" "docs/product/*.md"
      - name: Validate .eif/config.yaml.example against the config schema
        run: python scripts/eif_validate_frontmatter.py --framework-root . --config .eif/config.yaml.example
      - name: Validate .eif/framework.lock.yaml.example against the lock schema
        run: python scripts/eif_validate_frontmatter.py --framework-root . --lock .eif/framework.lock.yaml.example
      - name: Run validator fixture tests (positive + negative)
        run: python scripts/tests/test_validate.py

  vertical-slice:
    name: Vertical slice - init, index, search, locale, demo test (required by policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run all runtime test suites via run_all.py and emit the machine-readable inventory
        # run_all.py --json runs every suite (paths, validate, privacy-scan,
        # knowledge-delta, index, search, locale, render, markers,
        # verify-runtime, init, journey, adoption, merge-gate) once, parses
        # each suite's standardized `EIF-RESULT: passed=P total=T` line, and
        # emits a machine-readable inventory to the job log (evidence-freeze:
        # the check total is DERIVED by the runner, never hand-summed in PR
        # prose; a suite missing the line becomes `unknown`, not a silent 0).
        # It exits non-zero if any suite fails. test_run_all_json.py then
        # verifies the aggregation itself (a standalone suite so it does not
        # recurse into run_all).
        run: |
          python scripts/tests/run_all.py --json
          python scripts/tests/test_run_all_json.py
      - name: Validate the demo project instance's knowledge artifacts and config
        # framework-root stays the framework checkout; instance-root points
        # at the demo, which is not vendoring the framework - this is the
        # same separation PR #1 introduced, exercised against a real
        # second "instance" instead of only self-validating the framework
        # repository against itself.
        run: |
          python scripts/eif_validate_frontmatter.py --framework-root . --instance-root examples/demo-workspace "knowledge/**/*.md"
          python scripts/eif_validate_frontmatter.py --framework-root . --config examples/demo-workspace/.eif/config.yaml
          python scripts/eif_validate_frontmatter.py --framework-root . --lock examples/demo-workspace/.eif/framework.lock.yaml
      - name: Run the demo's behavioral test (stdlib unittest, no extra dependency)
        run: python examples/demo-workspace/tests/test_calendar_utils.py -v

  link-check:
    name: Relative link check (required by policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Check relative Markdown links
        run: python scripts/eif_check_links.py --repo .

  yaml-and-json-schema-syntax:
    name: YAML and JSON Schema syntax check (required by policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        # scripts/requirements.txt pins exact versions (==), which is what
        # keeps this from floating on latest - hash-pinning
        # (--require-hashes) is a possible future hardening step, not
        # implemented yet, see scripts/README.md#dependency-update-ownership.
        run: pip install -r scripts/requirements.txt
      - name: Validate YAML files parse and JSON Schemas are well-formed + self-consistent
        run: |
          python - <<'PYEOF'
          import sys, os, json
          import yaml
          from jsonschema import Draft202012Validator
          from jsonschema.exceptions import SchemaError

          # os.walk (not glob) so dot-directories like .eif/ are included -
          # glob's ** silently skips them by default, which would leave
          # .eif/config.yaml.example unchecked.
          yaml_suffixes = (".yaml", ".yml", ".yaml.example", ".yml.example")
          yaml_files = []
          for root, dirs, filenames in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for fn in filenames:
                  if fn.endswith(yaml_suffixes):
                      yaml_files.append(os.path.join(root, fn))

          failed = []
          for f in yaml_files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except Exception as e:
                  failed.append((f, str(e)))

          schema_files = []
          for root, dirs, filenames in os.walk("core/schemas"):
              for fn in filenames:
                  if fn.endswith(".json"):
                      schema_files.append(os.path.join(root, fn))
          for f in schema_files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      schema = json.load(fh)
                  Draft202012Validator.check_schema(schema)
              except (json.JSONDecodeError, SchemaError) as e:
                  failed.append((f, str(e)))

          for f, e in failed:
              print(f"FAIL {f}: {e}")
          if failed:
              sys.exit(1)
          print(f"ok: {len(yaml_files)} yaml file(s), {len(schema_files)} schema file(s) - all valid and self-consistent")
          PYEOF
        shell: bash

  package-build:
    name: "Package build and install (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
    # The dynamic per-combination name above is why THIS job itself cannot
    # be a required check context (GitHub's statusCheckRollup would need 4
    # exact, hardcoded combination strings, silently stale the moment the
    # matrix changes). package-build-required below is the static aggregate
    # that actually gets wired into merge-policy.json.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned runtime dependencies + build tooling
        run: |
          pip install -r scripts/requirements.txt
          pip install build hatchling
      - name: Build the wheel/sdist, install into a clean venv, run every eifctl subcommand end-to-end
        run: python scripts/tests/test_package_build.py

  package-build-required:
    name: "Package build required"
    # Static aggregate over the package-build matrix (adoption-hardening
    # round): needs: a matrix job resolves needs.package-build.result to
    # success only when EVERY combination succeeded - failure or cancelled
    # otherwise, GitHub's own semantics, not hand-enumerated here. if:
    # always() so this job still runs (and correctly reports failure)
    # even when a matrix leg failed, rather than being skipped - a required
    # check that can be silently skipped is not actually required. This is
    # the context name wired into core/policies/merge-policy.json, never
    # the dynamic per-combination name above.
    needs: package-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every package-build matrix combination succeeded
        run: |
          if [ "${{ needs.package-build.result }}" != "success" ]; then
            echo "package-build matrix result: ${{ needs.package-build.result }} - at least one combination did not succeed"
            exit 1
          fi
          echo "all package-build matrix combinations succeeded"

  license-check:
    name: Dependency license check (required by policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (the environment this check enforces policy against)
        run: pip install -r scripts/requirements.txt
      - name: Run license-checker unit tests
        run: python scripts/tests/test_check_licenses.py
      - name: Check every installed dependency's license against core/policies/license-policy.json
        # A fresh runner + `pip install -r requirements.txt` as the only
        # install step is exactly the trustworthy scope eif_check_licenses.py
        # documents needing - unlike an ambient local dev machine, nothing
        # unrelated is installed here to produce a false GPL/unknown finding.
        run: python scripts/eif_check_licenses.py --framework-root .

  knowledge-delta-check:
    name: Knowledge Delta completeness (required by policy)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Needs pull-requests:read to fetch the live PR body via the API. A
    # job-level permissions block replaces the top-level one, so contents:read
    # (for checkout) is repeated here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Run Knowledge Delta classifier tests
        run: python scripts/tests/test_knowledge_delta.py
      - name: Classify this PR's Knowledge Delta (live body, not the frozen event payload)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # github.event.pull_request.body is frozen to the payload at trigger
        # time: editing the PR body (or `gh run rerun`) does not refresh it, so
        # a body-only fix could never turn the check green without a new commit.
        # Fetching the body live via the API removes that trap entirely.
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > pr_body.txt
          python scripts/eif_check_knowledge_delta.py --body-file pr_body.txt
