name: lockfile-linux

# TEMPORARY, manual only. Regenerates site/package-lock.json on Linux and
# uploads it as an artifact.
#
# Why this exists: npm resolves the peer dependencies of an optional,
# platform-filtered package only on the platforms where that package applies.
# site/'s lockfile was written on Windows, where @rolldown/binding-wasm32-wasi
# is filtered out, so its @emnapi/* peers were never recorded - and `npm ci`
# on Linux then refuses with "Missing: @emnapi/... from lock file". No local
# flag reproduces that (`--os=linux --cpu=x64 --libc=glibc` changes nothing,
# because the filter is applied at install time, not at peer resolution).
#
# Delete this workflow once the regenerated lockfile is committed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Regenerate the lockfile on Linux
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
        working-directory: site
      - name: Prove npm ci accepts it here
        run: npm ci
        working-directory: site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock-linux
          path: site/package-lock.json
