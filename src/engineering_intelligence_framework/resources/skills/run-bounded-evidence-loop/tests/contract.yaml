  required: []
stop_conditions:
  required:
  - BLOCKED
forbidden_behavior:
  required:
  - not for unbounded autonomous repetition
assertions:
  manifest_contains:
  - bounded-evidence-loop.md
  canonical_contains:
  - 'status: validated'
  manifest_not_contains:
  - TODO
  - '[SKILL_PRUNED]'
supporting_files:
  scripts: []
  references: []
provenance:
  origin: repository
  source_revision: repository
  license: repository
  external_import: false
  surfaces_reviewed: &reviewed
    scripts: true
    references: true
    secrets: true
    network: true
    install: true
    permissions: true
evaluation:
  deterministic: required
  behavioral: required_for_material_semantic_change
