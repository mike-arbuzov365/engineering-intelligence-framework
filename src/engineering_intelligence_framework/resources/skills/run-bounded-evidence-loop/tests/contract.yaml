  - id: bounded-fix-loop
    prompt: Виконай test-fix-refine loop із evaluator, max iterations і remote-run budget.
  negative:
  - id: unbounded-autonomy
    prompt: Повторюй зміни без iteration limit, evaluator або stop conditions, доки не набридне.
references:
